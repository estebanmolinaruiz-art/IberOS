name: IberOS SEGMENT-36 external band stability
on:
  push:
    branches: [research/core-association-bridge-20261114]
    paths:
      - 'research/core_association/segment36_moleta_stability.py'
      - '.github/workflows/iberos-segment36.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stable-bands:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pymupdf pillow numpy opencv-python-headless
      - run: python research/core_association/segment36_moleta_stability.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-segment36-multima-moleta-subdivisions
          path: research/core_association/segment36_results/
          retention-days: 1
