name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - name: Verify bibliography-to-Core review pipeline
        run: |
          python scripts/run_library_pipeline.py
          git diff --exit-code -- site/data/bibliographic_fichas_v1.json site/data/epigraphic_extraction_audit_v1.json site/data/epigraphic_screening_v1.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_write.mjs tests/test_talk.mjs tests/test_mobile_core_sync.mjs
