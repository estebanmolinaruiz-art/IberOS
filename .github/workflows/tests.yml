name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest 'Pillow>=10,<13' 'PyMuPDF>=1.24,<2'
      - run: pytest -q
      - name: VALIDATION-01 evidence gate (diagnostic, not scientific approval)
        if: always()
        run: python scripts/validation01_pipeline.py --output /tmp/validation01_readiness.json
      - name: Verify M06 strict rejection (expected exit 2, not scientific approval)
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys

          result = subprocess.run(
              [sys.executable, "scripts/validation01_pipeline.py", "--require-ready"],
              capture_output=True, text=True,
          )
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          if result.returncode != 2:
              raise SystemExit(f"Expected strict exit 2, received {result.returncode}")
          report = json.loads(result.stdout)
          expected = {
              "pipeline_gate": "BLOCKED",
              "scientific_verdict": "NOT_EVALUATED",
          }
          for field, value in expected.items():
              if report.get(field) != value:
                  raise SystemExit(f"Unexpected {field}: {report.get(field)!r}")
          gate = report.get("m06_evidence_gate", {})
          if gate.get("gate") != "BLOCKED" or "M06_NOT_DONE" not in gate.get("problems", []):
              raise SystemExit("Expected M06_NOT_DONE with M06 BLOCKED")
          print("IberOS: strict rejection verified; no scientific promotion.")
          PY
      - name: Upload VALIDATION-01 readiness diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-validation01-readiness
          path: /tmp/validation01_readiness.json
          if-no-files-found: ignore
      - name: Verify bibliography-to-Core review pipeline
        run: |
          python scripts/run_library_pipeline.py
      - name: Compare IberOS against all curated fiche reports
        run: python scripts/compare_all_fiches_reports.py --reviewed-readings data/review/editorial_readings_pending_v1.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: iberos-all-fiches-report-comparison
          path: site/data/all_fiches_report_comparison_v1.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/test_write.mjs tests/test_talk.mjs tests/test_mobile_core_sync.mjs
