name: IberOS GOLDSET-40 image-only candidate atlas
on:
  push:
    branches: [research/core-association-bridge-20261114]
    paths:
      - 'research/core_association/goldset40_blind_components.py'
      - '.github/workflows/iberos-goldset40.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pymupdf pillow numpy opencv-python-headless
      - run: python research/core_association/goldset40_blind_components.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-goldset40-image-only-private-atlas
          path: research/core_association/goldset40_results/
          retention-days: 1
