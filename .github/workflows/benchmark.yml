name: benchmark
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "data/curated/**"
      - "data/benchmark/**"
      - "scripts/benchmark_snapshot.py"
      - "docs/BENCHMARK.md"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "data/curated/**"
      - "data/benchmark/**"
      - "scripts/benchmark_snapshot.py"
      - "docs/BENCHMARK.md"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test suite
        run: pytest -q
      - name: Regenerate benchmark snapshot
        run: python scripts/benchmark_snapshot.py --output /tmp/benchmark_results_v1.0.1.json
      - name: Verify frozen snapshot
        run: diff -u data/benchmark/benchmark_results_v1.0.1.json /tmp/benchmark_results_v1.0.1.json
      - name: Upload verified benchmark
        uses: actions/upload-artifact@v4
        with:
          name: IberOS-benchmark-v1.0.1
          path: /tmp/benchmark_results_v1.0.1.json
