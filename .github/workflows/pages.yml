name: pages
on:
  # Publicar solo después de acumular un lote de 10 cambios.
  # Los tests siguen ejecutándose con cada push; Pages solo por lanzamiento manual.
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified CORE audit data for public fichas
        run: |
          python -m pip install -e .
          python scripts/export_web_core.py
          python scripts/export_mobile_core.py
          python -c "import json; x=json.load(open('site/data/mobile_core_bundle_v1.json')); assert x['object_count']==38"
          python -c "import json; x=json.load(open('site/data/core_object_audit_v1.json')); assert x['object_count']==38"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit scientific Core to web integrations
        run: node scripts/test-integration.mjs
      - name: Embed deployed commit marker in published artifact
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          pathlib.Path("site/deployment-version.json").write_text(json.dumps({"schema":"IberOS-deployment-v1","commit":os.environ["EXPECTED_SHA"]})+"\n",encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
      - name: Verify deployed public website matches this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_BASE: https://estebanmolinaruiz-art.github.io/IberOS
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ["PUBLIC_BASE"].rstrip("/")
          expected=os.environ["EXPECTED_SHA"]
          paths=["/deployment-version.json", "/ficha/?id=IBR-PLM-0002", "/data/epigraphic-visual-registry-v1.json", "/demostracion/", "/data/ficha-enrichment-featured.json"]
          for attempt in range(1,13):
              try:
                  responses={}
                  for path in paths:
                      url=base+path
                      request=urllib.request.Request(url,headers={"User-Agent":"IberOS-Deploy-Verification/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          if response.status!=200: raise RuntimeError(f"{path}: HTTP {response.status}")
                          responses[path]=response.read().decode("utf-8")
                  manifest=json.loads(responses[paths[0]])
                  if manifest.get("commit")!=expected:
                      raise RuntimeError(f"Public SHA {manifest.get('commit')} != {expected}")
                  if "graphic-viewer-slot" not in responses[paths[1]]:
                      raise RuntimeError("Ficha pública sin contenedor de visor gráfico")
                  data=json.loads(responses[paths[2]])
                  if not any(x.get("object_id")=="IBR-PLM-0002" for x in data.get("records",[])):
                      raise RuntimeError("Registro gráfico público sin Tivissa")
                  demo=responses["/demostracion/"]
                  featured=json.loads(responses["/data/ficha-enrichment-featured.json"])
                  ids={x.get("OBJECT_ID") for x in featured}
                  if not all(x in ids for x in ("IBR-PLM-0002","IBR-PLM-0003","IBR-PLM-0004")):
                      raise RuntimeError("Faltan casos documentados Tivissa, Pech-Maho o Coimbra")
                  if "URLSearchParams(location.search)" not in demo or "case-title" not in demo:
                      raise RuntimeError("Demostración pública sin selector de casos")
                  print(f"VERIFICADO: sitio público responde; versión {expected}; ficha, registro y demostraciones disponibles")
                  break
              except Exception as e:
                  print(f"Intento {attempt}/12: {e}",flush=True)
                  if attempt==12: raise
                  time.sleep(10)
          PY
