name: Comprobaciones web gratuitas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar integridad de web, datos y scripts
        run: node scripts/check-site.mjs\n      - name: Pruebas funcionales reales de Core\n        run: node scripts/test-core.mjs
