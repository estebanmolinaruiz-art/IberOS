name: Comprobaciones web gratuitas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar integridad de web, datos y scripts
        run: node scripts/check-site.mjs
      - name: Pruebas funcionales reales de Core
        run: node scripts/test-core.mjs
      - name: Preparar Chromium para pruebas reales de interfaz
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: "Laboratorio: navegación, autoguardado, exportación y recuperación"
        run: |
          python3 -m http.server 8765 --directory site >/tmp/iberos-http.log 2>&1 &
          node scripts/test-laboratorio-browser.mjs
      - name: Guardar captura si falla la prueba de navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-captura-error
          path: /tmp/iberos-browser-fallo.png
          if-no-files-found: ignore
