name: Comprobaciones web gratuitas
on:
  # QA de lote: ejecutar una vez al abrir o actualizar la PR del paquete.
  # No ejecutar una batería por cada archivo guardado directamente en main.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comprobar-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Evitar ejecuciones duplicadas de CI por push y PR
        run: node scripts/check-ci-trigger-policy.mjs
      - name: Build scientific Core audit and test cross-module integration
        run: |
          python -m pip install -e .
          python scripts/export_web_core.py
          python scripts/audit_visual_signs.py --output site/data/core_visual_sign_readiness_v1.json
          python -c "import json; x=json.load(open('site/data/core_visual_sign_readiness_v1.json')); assert x['review_units']>=26 and x['editorial_decisions_supported']==2 and x['independently_verified_glyphs']==0 and x['automatic_core_promotion'] is False"
          node scripts/test-integration.mjs
      - name: Comprobar integridad de web, datos generados y scripts
        run: node scripts/check-site.mjs
      - name: Pruebas funcionales reales de Core
        run: node scripts/test-core.mjs
      - name: Preparar Chromium para pruebas reales de interfaz
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: "Laboratorio: navegación, autoguardado, exportación y recuperación"
        run: |
          python3 -m http.server 8765 --directory site >/tmp/iberos-http.log 2>&1 &
          node scripts/test-laboratorio-browser.mjs
      - name: "Recorrido real: Corpus, Ficha, CORE y Laboratorio"
        run: |
          python3 -m http.server 8765 --directory site >/tmp/iberos-http.log 2>&1 &
          node scripts/test-navigation-browser.mjs
      - name: Guardar captura si falla la prueba de navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-captura-error
          path: /tmp/iberos-browser-fallo.png
          if-no-files-found: ignore
