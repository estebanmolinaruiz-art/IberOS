name: Web E2E (free Chromium)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'tests/web_e2e/**'
      - '.github/workflows/web-e2e-free.yml'
  push:
    paths:
      - 'site/**'
      - 'tests/web_e2e/**'
      - '.github/workflows/web-e2e-free.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run navigation and Write smoke tests
        run: node --test tests/web_e2e/browser.mjs
      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-e2e-failure
          path: /tmp/iberos-e2e-*.png
          if-no-files-found: ignore
