name: IberOS prediction and possible translation (SCI-PRED-01)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/iberos/prediction_translation_work.py'
      - 'scripts/run_prediction_translation_works.py'
      - 'data/review/prediction_translation_pilot_v1.json'
      - 'tests/test_prediction_translation_work.py'
      - 'src/iberos/prospective_role_lock.py'
      - 'src/iberos/prospective_role_evaluation.py'
      - 'scripts/evaluate_prospective_roles.py'
      - 'research/protocols/SCI_PRED_02_FUTURE_ROLE_RULE_20261112.json'
      - 'tests/test_prospective_role_lock.py'
      - 'tests/test_prospective_role_evaluation.py'
      - '.github/workflows/science-prediction-translation.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research kit and tests
        run: python -m pip install -e . pytest
      - name: Test new prediction/translation dossier and existing controls
        run: |
          python -m pytest -q tests/test_prediction_translation_work.py tests/test_prediction_compare.py tests/test_interpretation_candidates.py tests/test_corex_p01.py tests/test_holdout_01.py tests/test_prospective_role_lock.py tests/test_prospective_role_evaluation.py
      - name: Generate machine-readable scientific docket
        run: |
          mkdir -p /tmp/iberos-prediction-translation
          python scripts/run_prediction_translation_works.py --output /tmp/iberos-prediction-translation/audit.json
          git rev-parse HEAD > /tmp/iberos-prediction-translation/commit.txt
      - name: Produce role-scoring audit with zero independently supplied GOLD
        run: |
          python scripts/evaluate_prospective_roles.py --output /tmp/iberos-prediction-translation/roles_audit.json
          python - <<'PY'
          import json
          p='/tmp/iberos-prediction-translation/roles_audit.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['total_attempted_physical_objects'] == 0
          assert r['experimental_state'] == 'INSUFFICIENT_N'
          assert r['scientific_pass'] is False
          assert r['translation_validated'] is False
          PY
      - name: Verify strict semantic rejection is intentional
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          p = subprocess.run([
              sys.executable, "scripts/run_prediction_translation_works.py",
              "--require-scientific-confirmation",
          ], capture_output=True, text=True)
          if p.returncode != 2:
              raise SystemExit(f"Expected refusal (2), got {p.returncode}: {p.stderr}")
          doc = json.loads(p.stdout)
          assert doc["scientific_verdict"] == "NOT_EVALUATED"
          assert doc["translation_validated"] is False
          assert doc["docket"]["semantically_evaluated_predictions"] == 0
          print("Scientific gate correctly blocked; no invented translation accuracy.")
          PY
      - name: Preserve reproducible audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-sci-pred-01-audit
          path: /tmp/iberos-prediction-translation/
          if-no-files-found: warn
