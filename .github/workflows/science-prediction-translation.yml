name: IberOS prediction and possible translation (SCI-PRED-01)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/iberos/prediction_translation_work.py'
      - 'scripts/run_prediction_translation_works.py'
      - 'data/review/prediction_translation_pilot_v1.json'
      - 'tests/test_prediction_translation_work.py'
      - 'src/iberos/prospective_role_lock.py'
      - 'src/iberos/prospective_role_evaluation.py'
      - 'scripts/evaluate_prospective_roles.py'
      - 'research/protocols/SCI_PRED_02_FUTURE_ROLE_RULE_20261112.json'
      - 'tests/test_prospective_role_lock.py'
      - 'tests/test_prospective_role_evaluation.py'
      - 'src/iberos/scientific_candidate_intake.py'
      - 'scripts/scientific_core_works_status.py'
      - 'data/review/sci_pred04_candidate_queue_v1.json'
      - 'tests/test_scientific_candidate_intake.py'
      - 'tests/test_scientific_core_works_status.py'
      - 'src/iberos/ponderal_model_comparison.py'
      - 'data/review/sci_met03_published_weights_v1.json'
      - 'tests/test_ponderal_model_comparison.py'
      - 'src/iberos/marked_weight_sensitivity.py'
      - 'data/review/sci_met04_bastida_dot_mark_cases_v1.json'
      - 'tests/test_marked_weight_sensitivity.py'
      - 'docs/SCI_CORE_05_PROCESSES_AND_WORKS_20261112.md'
      - '.github/workflows/science-prediction-translation.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research kit and tests
        run: python -m pip install -e . pytest
      - name: Test new prediction/translation dossier and existing controls
        run: |
          python -m pytest -q tests/test_prediction_translation_work.py tests/test_prediction_compare.py tests/test_interpretation_candidates.py tests/test_corex_p01.py tests/test_holdout_01.py tests/test_prospective_role_lock.py tests/test_prospective_role_evaluation.py tests/test_scientific_candidate_intake.py tests/test_scientific_core_works_status.py tests/test_ponderal_model_comparison.py tests/test_marked_weight_sensitivity.py
      - name: Generate machine-readable scientific docket
        run: |
          mkdir -p /tmp/iberos-prediction-translation
          python scripts/run_prediction_translation_works.py --output /tmp/iberos-prediction-translation/audit.json
          git rev-parse HEAD > /tmp/iberos-prediction-translation/commit.txt
      - name: Produce role-scoring audit with zero independently supplied GOLD
        run: |
          python scripts/evaluate_prospective_roles.py --output /tmp/iberos-prediction-translation/roles_audit.json
          python - <<'PY'
          import json
          p='/tmp/iberos-prediction-translation/roles_audit.json'
          r=json.load(open(p, encoding='utf-8'))
          assert r['total_attempted_physical_objects'] == 0
          assert r['experimental_state'] == 'INSUFFICIENT_N'
          assert r['scientific_pass'] is False
          assert r['translation_validated'] is False
          PY
      - name: Audit source candidate intake and research works (zero-GOLD)
        run: |
          python -m iberos.scientific_candidate_intake --input data/review/sci_pred04_candidate_queue_v1.json --output /tmp/iberos-prediction-translation/intake.json
          python scripts/scientific_core_works_status.py --output /tmp/iberos-prediction-translation/works.json
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('/tmp/iberos-prediction-translation')
          intake=json.loads((folder/'intake.json').read_text(encoding='utf-8'))
          works=json.loads((folder/'works.json').read_text(encoding='utf-8'))
          assert intake['total_leads'] == 7
          assert intake['ready_for_external_admission_audit'] == 0
          assert intake['translation_validated'] is False
          assert works['scientific_results']['unblinded_real_objects'] == 0
          assert works['scientific_results']['confirmed_translations'] == 0
          assert works['scientific_results']['scientific_pass'] is False
          print('Intake and scientific WORKS: no hidden gold or fabricated progress.')
          PY
      - name: Calculate SCI-MET-03 real archaeological mass model comparison
        run: |
          python -m iberos.ponderal_model_comparison --output /tmp/iberos-prediction-translation/sci_met03.json
          python - <<'PY'
          import json
          f='/tmp/iberos-prediction-translation/sci_met03.json'
          r=json.load(open(f,encoding='utf-8'))
          assert r["villanueva"]["model_42_with_half_ratios_exactly_identical_to_21"]
          assert r["scientific_result"] == "UNDERDETERMINED_MARK_SEMANTICS"
          assert r["validated_translation_count"] == 0
          PY
      - name: Test SCI-MET-04 original published two vs hypothetical three dots
        run: |
          python -m iberos.marked_weight_sensitivity --output /tmp/iberos-prediction-translation/sci_met04.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/iberos-prediction-translation/sci_met04.json',encoding='utf-8'))
          two,three=r['alternative_mark_count_scenarios']
          assert two['assumed_mark_count']==2 and two['absolute_relative_error_pct']>50
          assert three['assumed_mark_count']==3 and three['absolute_relative_error_pct']<3
          assert r['confirmed_translations']==0
          assert not r['number_of_marks_verified_from_original_image']
          PY
      - name: Verify strict semantic rejection is intentional
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          p = subprocess.run([
              sys.executable, "scripts/run_prediction_translation_works.py",
              "--require-scientific-confirmation",
          ], capture_output=True, text=True)
          if p.returncode != 2:
              raise SystemExit(f"Expected refusal (2), got {p.returncode}: {p.stderr}")
          doc = json.loads(p.stdout)
          assert doc["scientific_verdict"] == "NOT_EVALUATED"
          assert doc["translation_validated"] is False
          assert doc["docket"]["semantically_evaluated_predictions"] == 0
          print("Scientific gate correctly blocked; no invented translation accuracy.")
          PY
      - name: Preserve reproducible audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-sci-pred-01-audit
          path: /tmp/iberos-prediction-translation/
          if-no-files-found: warn
