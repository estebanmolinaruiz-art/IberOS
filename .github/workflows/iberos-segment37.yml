name: IberOS SEGMENT-37 photo drawing cross-registration
on:
  push:
    branches: [research/core-association-bridge-20261114]
    paths:
      - 'research/core_association/segment37_photo_drawing.py'
      - '.github/workflows/iberos-segment37.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pymupdf pillow numpy opencv-python-headless
      - run: python research/core_association/segment37_photo_drawing.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iberos-segment37-geometry-report
          path: research/core_association/segment37_results/report.json
          retention-days: 30
