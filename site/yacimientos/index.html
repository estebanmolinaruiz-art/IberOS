<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS+ · Yacimientos</title><link rel="stylesheet" href="../assets/iberos-plus.css"></head><body><div id="head"></div><section class="hero"><div class="hero-inner"><div class="eyebrow">Territorio</div><h1>Yacimientos y procedencias</h1><p>Índice territorial derivado del registro público. Agrupa objetos por procedencia sin convertir esos grupos en fronteras lingüísticas o culturales.</p></div></section><main><div class="toolbar"><input id="q" placeholder="Buscar yacimiento o localidad…"></div><p class="lead"><strong id="count">—</strong> agrupaciones visibles.</p><div id="grid" class="grid"></div></main>
<script type="module">import{header,text,csv,esc}from"../assets/portal-data.js";document.getElementById("head").innerHTML=header("../");const rows=csv(await text("../data/objects.csv"));const g=new Map();for(const r of rows){const k=(r.Yacimiento||"Procedencia no fijada").trim();if(!g.has(k))g.set(k,[]);g.get(k).push(r)}const q=document.getElementById("q"),grid=document.getElementById("grid"),count=document.getElementById("count");function render(){const s=q.value.toLowerCase();const out=[...g.entries()].filter(([k,v])=>!s||(k+" "+v.map(x=>x.Localidad).join(" ")).toLowerCase().includes(s)).sort((a,b)=>a[0].localeCompare(b[0]));count.textContent=out.length;grid.innerHTML=out.map(([k,v])=>'<article class="card"><span class="pill">'+v.length+' objeto'+(v.length>1?'s':'')+'</span><h3>'+esc(k)+'</h3><p class="meta">'+esc([...new Set(v.map(x=>x.Localidad).filter(Boolean))].join(" · "))+'</p>'+v.map(x=>'<p><a href="../ficha/?id='+encodeURIComponent(x.OBJECT_ID)+'">'+esc(x.OBJECT_ID)+' · '+esc(x.Nombre_objeto)+'</a></p>').join("")+'</article>').join("")}q.oninput=render;render();</script></body></html>
