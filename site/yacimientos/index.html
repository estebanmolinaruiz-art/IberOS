<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS+ · Yacimientos</title><link rel="stylesheet" href="../assets/iberos-plus.css"></head><body><div id="head"></div><section class="hero"><div class="hero-inner"><div class="eyebrow">Territorio y procedencia</div><h1>Yacimientos y <em>paisajes</em></h1><p>Índice territorial derivado del registro público. Agrupa objetos por procedencia sin convertir esos grupos en fronteras lingüísticas o culturales.</p><div class="hero-search"><input id="heroQ" placeholder="Buscar yacimiento o localidad…"><button id="heroGo">Buscar →</button></div><div class="hero-actions"><a class="btn light" href="../atlas/">Abrir atlas interactivo</a></div></div></section><main><div class="archive-head"><div><div class="section-kicker">Procedencias</div><h2 class="section-title"><span id="count">—</span> agrupaciones</h2></div><div class="archive-tools"><input id="q" placeholder="Filtrar yacimientos…" style="padding:11px;border:1px solid #cbb891;border-radius:9px;background:#fffaf1"></div></div><div id="grid" class="corpus-grid"></div></main><script type="module">import{header,text,csv,esc}from"../assets/portal-data.js";document.getElementById("head").innerHTML=header("../");const rows=csv(await text("../data/objects.csv"));const g=new Map();for(const r of rows){const k=(r.Yacimiento||"Procedencia no fijada").trim();if(!g.has(k))g.set(k,[]);g.get(k).push(r)}const q=document.getElementById("q"),hq=document.getElementById("heroQ"),grid=document.getElementById("grid"),count=document.getElementById("count");function render(){const s=q.value.toLowerCase();const out=[...g.entries()].filter(([k,v])=>!s||(k+" "+v.map(x=>x.Localidad).join(" ")).toLowerCase().includes(s)).sort((a,b)=>a[0].localeCompare(b[0]));count.textContent=out.length;grid.innerHTML=out.map(([k,v])=>'<article class="site-card"><div class="media"></div><div class="copy"><span class="pill">'+v.length+' objeto'+(v.length>1?'s':'')+'</span><h3>'+esc(k)+'</h3><p class="meta">'+esc([...new Set(v.map(x=>x.Localidad).filter(Boolean))].join(" · "))+'</p><ul>'+v.slice(0,4).map(x=>'<li><a href="../ficha/?id='+encodeURIComponent(x.OBJECT_ID)+'">'+esc(x.OBJECT_ID)+' · '+esc(x.Nombre_objeto)+'</a></li>').join("")+'</ul><p><a class="btn alt" href="../corpus/?q='+encodeURIComponent(k)+'">Ver en Corpus</a></p></div></article>').join("")}q.oninput=render;document.getElementById("heroGo").onclick=()=>{q.value=hq.value;render()};render();</script></body></html>
