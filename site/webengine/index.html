<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS Web Engine</title>
<style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:0 20px}input,button{font:inherit;padding:8px}pre{white-space:pre-wrap;background:#f3f5f7;padding:15px;border-radius:10px}</style></head><body>
<h1>IberOS Web Engine 1.0.1-web.2</h1><p>Consulta el registro público directamente desde GitHub.</p>
<input id="q" value="SALIR"><button id="go">Buscar</button><pre id="out">Inicializando…</pre>
<script type="module">
import {createIberOS,IBEROS_WEB_ENGINE_VERSION} from "./iberos-web.mjs";
const out=document.querySelector('#out'), q=document.querySelector('#q');
try{
 const engine=await createIberOS();
 const run=()=>{const rows=engine.search(q.value);out.textContent=JSON.stringify({engine_version:IBEROS_WEB_ENGINE_VERSION,count:rows.length,results:rows.slice(0,10)},null,2)};
 document.querySelector('#go').onclick=run; run();
}catch(e){out.textContent='Error: '+e.message;}
</script></body></html>
