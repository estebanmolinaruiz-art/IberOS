<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS+ · Ficha</title><link rel="stylesheet" href="../assets/iberos-plus.css"></head><body><div id="head"></div>
<section class="hero"><div class="hero-inner"><div class="eyebrow">Ficha web</div><h1 id="title">Cargando objeto…</h1><p id="sub"></p></div></section><main><div id="body"></div></main><footer><div class="wrap">IberOS+ · ficha web derivada del registro público; no sustituye una edición epigráfica original.</div></footer>
<script type="module">import{header,text,csv,esc}from"../assets/portal-data.js";document.getElementById("head").innerHTML=header("../");const rows=csv(await text("../data/objects.csv")),rels=csv(await text("../data/families.csv"));const id=new URLSearchParams(location.search).get("id");const r=rows.find(x=>x.OBJECT_ID===id),body=document.getElementById("body");if(!r){document.getElementById("title").textContent="Objeto no encontrado";body.innerHTML='<div class="empty">El OBJECT_ID solicitado no existe.</div>'}else{document.title="IberOS+ · "+r.Nombre_objeto;document.getElementById("title").textContent=r.Nombre_objeto;document.getElementById("sub").textContent=r.OBJECT_ID+" · "+(r.Referencia_epigráfica||"referencia no fijada");const fam=rels.filter(x=>x.OBJECT_ID===r.OBJECT_ID).map(x=>x.Familia);const fields=[["Tipo",r.Tipo_objeto],["Yacimiento",r.Yacimiento],["Localidad",r.Localidad],["Soporte",r.Soporte],["Escritura",r.Escritura],["Cronología",r.Cronología],["Inclusión IberOS",r.IberOS_Inclusion],["Estado PALEO",r.PALEO_Status],["Módulos activos",r.Modulos_Activos],["Dependencia",r.Dependency_Group],["Estado de ficha",r.Estado_ficha],["PDF declarado",r.Archivo_ficha]];const related=[...new Set(rels.filter(x=>fam.includes(x.Familia)&&x.OBJECT_ID!==r.OBJECT_ID).map(x=>x.OBJECT_ID))].slice(0,8);const by=Object.fromEntries(rows.map(x=>[x.OBJECT_ID,x]));body.innerHTML='<div class="detail"><section><div class="card"><h2>Datos del objeto</h2>'+fields.map(([a,b])=>'<div class="kv"><b>'+esc(a)+'</b><span>'+esc(b||"—")+'</span></div>').join("")+'</div><div class="card" style="margin-top:16px"><h2>Observaciones</h2><p>'+esc(r.Observaciones||"Sin observaciones públicas.")+'</p></div></section><aside><div class="card"><h3>Familias</h3><p>'+fam.map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</p><h3>Fuente declarada</h3><p>'+(r.Fuente?'<a href="'+esc(r.Fuente)+'" target="_blank" rel="noopener">Abrir fuente ↗</a>':'Pendiente en el registro')+'</p><a class="btn" href="../corpus/">Volver al Corpus</a></div></aside></div>'+(related.length?'<div class="section-kicker" style="margin-top:38px">Conexiones</div><h2 class="section-title">Objetos relacionados por familia</h2><div class="grid">'+related.map(x=>'<article class="card"><div class="meta">'+esc(x)+'</div><h3>'+esc(by[x]?.Nombre_objeto||x)+'</h3><a href="?id='+encodeURIComponent(x)+'">Abrir ficha →</a></article>').join("")+'</div>':"")}</script></body></html>
