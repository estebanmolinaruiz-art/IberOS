<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS+ · Ficha</title><link rel="stylesheet" href="../assets/iberos-plus.css"></head><body class="iberos-inner iberos-ficha"><div id="head"></div><main><div id="body"><div class="notice" role="status">Cargando ficha arqueológica… Si permanece este mensaje, consulta el <a href="../corpus/">Corpus</a>.</div></div></main><footer><div class="wrap">Ficha web derivada del registro público. La portada documental no se presenta como fotografía del objeto.</div></footer>
<script type="module">import{showResearchContext}from"../assets/research-context.js";showResearchContext();
import{header,text,csv,esc}from"../assets/portal-data.js";
document.getElementById("head").innerHTML=header("../");
let rows=[],rels=[];try{rows=csv(await text("../data/objects.csv"));if(!rows.length)throw Error("El catálogo está vacío");}catch(e){document.getElementById("body").innerHTML='<div class="notice" role="alert"><h2>La ficha no está disponible temporalmente</h2><p>No hemos podido cargar los registros. Prueba de nuevo o consulta el <a href="../corpus/">Corpus</a>.</p></div>';console.error("Error de fichas",e)}
try{rels=csv(await text("../data/families.csv"))}catch(e){console.warn("Relaciones no disponibles",e)}
const id=new URLSearchParams(location.search).get("id");
const r=rows.find(x=>x.OBJECT_ID===id);
const body=document.getElementById("body");
function shardFor(id){
 if(/^IBR-CER-/.test(id)||/^IBR-COI-/.test(id)||id==="IBR-CTL-0001")return 1;
 if(/^IBR-LAP-/.test(id)||/^IBR-MON-/.test(id)||id==="IBR-CTL-0002"||id==="IBR-CTL-0003")return 2;
 if(/^IBR-MUS-/.test(id)||/^IBR-OBJ-/.test(id)||/^IBR-PLM-000[1-4]$/.test(id))return 3;
 if(/^IBR-PLM-00(0[5-9]|1[0-2])$/.test(id))return 4;
 if(id==="IBR-PLM-0013"||/^IBR-RUP-/.test(id))return 5;
 return null;
}
if(!r){
 body.innerHTML='<div class="notice">Objeto no encontrado.</div>';
}else{
 document.title="IberOS+ · "+r.Nombre_objeto;
 const fam=rels.filter(x=>x.OBJECT_ID===r.OBJECT_ID).map(x=>x.Familia);
 let en=null;
 const verifiedPhotos={"IBR-LAP-0003":{"file":"Estela funeraria ibérica, (siglo I a. C.), Sinarcas, Museo de Prehistoria de Valencia 01.jpg","author":"Dorieo","license":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File:Estela_funeraria_ib%C3%A9rica,_(siglo_I_a._C.),_Sinarcas,_Museo_de_Prehistoria_de_Valencia_01.jpg","caption":"Fotografía de la estela funeraria de Sinarcas","src":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Estela%20funeraria%20ib%C3%A9rica%2C%20(siglo%20I%20a.%20C.)%2C%20Sinarcas%2C%20Museo%20de%20Prehistoria%20de%20Valencia%2001.jpg?width=800"},"IBR-MUS-0001":{"file":"Mosaico Casa de Likine - La Caridad.jpg","author":"Sonsinbeles","license":"Dominio público (Public Domain Mark)","page":"https://commons.wikimedia.org/wiki/File:Mosaico_Casa_de_Likine_-_La_Caridad.jpg","caption":"Fotografía del mosaico de La Caridad","src":"https://commons.wikimedia.org/wiki/Special:Redirect/file/Mosaico%20Casa%20de%20Likine%20-%20La%20Caridad.jpg?width=800"}};
 const covers={"IBR-PLM-0001":"../assets/ficha-covers/ullastret.webp","IBR-PLM-0002":"../assets/ficha-covers/tivissa.webp","IBR-PLM-0003":"../assets/ficha-covers/pech-maho.webp","IBR-PLM-0004":"../assets/ficha-covers/coimbra.webp","IBR-MUS-0001":"../assets/ficha-covers/caminreal.webp","IBR-LAP-0005":"../assets/ficha-covers/sagunto.webp"};
 const cover=covers[r.OBJECT_ID]||"";
 const dictionary={"INCLUDE":"Incluida en el corpus de investigación","CONDITIONAL":"Incluida con reservas documentales","CONTROL_ONLY":"Pieza de control; no cuenta como inscripción independiente","EXCLUDED_CONTROL":"Excluida del corpus de inscripciones auténticas","READY":"Revisión paleográfica preparada","REVIEW_NEEDED":"Necesita revisión paleográfica","HIGH_UNCERTAINTY":"Lectura o interpretación incierta","INDEPENDENT_OR_UNRESOLVED":"Independencia documental no resuelta","DEPENDENT_COPY":"Copia dependiente de otra pieza","ONE_OR_FEW_ENTRIES":"Una o pocas inscripciones registradas","NEEDS_SUBENTRY_SPLIT":"Necesita separar las inscripciones del objeto","PALEO":"Análisis de signos y escritura","TRACE":"Trazabilidad documental","MORPH":"Análisis morfológico experimental","LEXSEM":"Estudio léxico y semántico experimental","DUAL_LOCK":"Control de escritura dual","GRECO_LOCK":"Control de escritura grecoibérica","ICONO":"Estudio iconográfico","SIGNARY_DETECT":"Detección de signarios","NEGATIVE_CONTROL":"Control negativo","LEAK_SAFE":"Control de dependencia entre datos","DEPENDENCY":"Análisis de relaciones documentales","NUMISMATIC":"Estudio numismático","BILINGUAL_CONTROL":"Comparación bilingüe","FICHA PUBLICABLE":"Ficha disponible para consulta"};const readable=v=>String(v||"").split(";").map(x=>dictionary[x.trim()]||x.trim().replaceAll("_"," ").toLowerCase()).join("; "); const fields=[["Tipo",r.Tipo_objeto],["Yacimiento",r.Yacimiento],["Localidad",r.Localidad],["Soporte",r.Soporte],["Escritura",r.Escritura],["Cronología",r.Cronología],["Uso en investigación",r.IberOS_Inclusion],["Revisión de escritura",r.PALEO_Status],["Herramientas disponibles",r.Modulos_Activos],["Relación con otros registros",r.Dependency_Group],["Estado de ficha",r.Estado_ficha],["Referencia de archivo (no implica descarga disponible)",r.Archivo_ficha]];
 const by=Object.fromEntries(rows.map(x=>[x.OBJECT_ID,x]));
 const related=[...new Set(rels.filter(x=>fam.includes(x.Familia)&&x.OBJECT_ID!==r.OBJECT_ID).map(x=>x.OBJECT_ID))].slice(0,6);
 function coverHtml(){const photo=verifiedPhotos[r.OBJECT_ID];if(cover)return '<div class="artifact-visual doc-cover fiche-illustration"><img src="'+esc(cover)+'" alt="Portada documental de '+esc(r.Nombre_objeto)+'" onerror="this.hidden=true;this.parentElement.classList.add(\'without-image\')"><span class="artifact-doc-label">Portada documental IberOS · no es fotografía de la pieza</span></div>'+(photo?'<p class="photo-credit"><a href="'+esc(photo.page)+'" target="_blank" rel="noopener">Ver fotografía real · '+esc(photo.author)+' · '+esc(photo.license)+' ↗</a></p>':'');return '<div class="artifact-visual fiche-identity"><div class="fiche-identity-inner"><span>FICHA ARQUEOLÓGICA</span><strong>'+esc(r.Nombre_objeto)+'</strong><small>'+esc(r.Tipo_objeto||"Pieza arqueológica")+' · '+esc(r.Yacimiento||"Procedencia no fijada")+'</small>'+(photo?'<a href="'+esc(photo.page)+'" target="_blank" rel="noopener">Ver fotografía real acreditada ↗</a>':'<em>No consta fotografía documental propia</em>')+'</div></div>'}
 function summaryHtml(){
   return coverHtml()+'<div class="artifact-summary"><div class="section-kicker" style="color:var(--gold2)">Ficha de pieza</div><h1>'+esc(r.Nombre_objeto)+'</h1><p class="meta">Referencia arqueológica: '+esc(r.Referencia_epigráfica||"no fijada")+'</p><details class="technical-ref"><summary>Identificador interno</summary><code>'+esc(r.OBJECT_ID)+'</code></details><p>'+esc(r.Yacimiento||"Procedencia no fijada")+(r.Localidad?' · '+esc(r.Localidad):'')+'</p><p><span class="pill">'+esc(r.Soporte||"—")+'</span><span class="pill">'+esc(r.Escritura||"—")+'</span><span class="pill">'+esc(r.Cronología||"—")+'</span></p><div class="artifact-actions"><a href="../webengine/?q='+encodeURIComponent(r.OBJECT_ID)+'">Ver en Core →</a><a href="../laboratorio/?id='+encodeURIComponent(r.OBJECT_ID)+'">Llevar al laboratorio</a><a href="../atlas/">Abrir en Atlas</a><a href="../modelos3d/">Explorar 3D</a></div></div>';
 }
 function metadataHtml(){
   const rowsHtml=fields.map(([a,b])=>'<div class="kv"><b>'+esc(a)+'</b><span>'+esc(readable(b)||"Sin información pública")+'</span></div>').join("");
   const famHtml=fam.map(x=>'<span class="pill">'+esc(readable(x))+'</span>').join("");
   const source=r.Fuente?'<a href="'+esc(r.Fuente)+'" target="_blank" rel="noopener">Abrir fuente original ↗</a>':'Pendiente en este registro';
   return '<div class="evidence-path"><div class="evidence-node"><b>Descripción</b><span>metadatos y contexto</span></div><div class="evidence-node"><b>Familias</b><span>relaciones estructurales</span></div><div class="evidence-node"><b>Fuente</b><span>procedencia documental</span></div><div class="evidence-node"><b>Proyecto</b><span>pregunta reproducible</span></div></div><div class="detail"><section><div class="card"><h2>Datos de la pieza</h2><p>La información procede del registro público IberOS. Los términos técnicos se presentan en castellano; los identificadores internos se conservan para trazabilidad.</p>'+rowsHtml+'</div><div class="card" style="margin-top:12px"><h2>Observaciones</h2><p>'+esc(r.Observaciones||"Sin observaciones públicas adicionales en el registro.")+'</p></div></section><aside><div class="card"><h3>Familias relacionadas</h3><p>'+famHtml+'</p><h3>Fuente declarada</h3><p>'+source+'</p><a class="btn gold" href="../laboratorio/?id='+encodeURIComponent(r.OBJECT_ID)+'">Investigar esta pieza</a></div></aside></div>';
 }
 function enrichmentHtml(){
   if(!en)return '<div class="notice" style="margin-top:26px"><strong>Enriquecimiento documental pendiente en esta ficha pública.</strong> Los metadatos y herramientas siguen disponibles.</div>';
   const bib=(en.bibliography||[]).map(b=>'<li>'+esc(b)+'</li>').join("");
   const citation=en.citation?'<h3>Cita sugerida</h3><p>'+esc(en.citation)+'</p>':'';
   const dossier=["IBR-PLM-0002","IBR-PLM-0003","IBR-PLM-0004"].includes(en.OBJECT_ID)?'<p><a class="btn gold" href="https://zenodo.org/records/22957236/files/IberOS_CaseStudies_I_v1.0_4_fichas.pdf?download=1">Abrir dossier PDF ↗</a></p>':'';
   return '<div class="section-kicker" style="margin-top:30px">Lectura documental</div><h2 class="section-title">Evidencia, inferencia y límites</h2><div class="case-grid"><article class="card"><span class="pill ok">Evidencia fuerte</span><h3>Qué sostiene la ficha</h3><p>'+esc(en.evidence||"—")+'</p></article><article class="card"><span class="pill warn">Inferencia apoyada</span><h3>Qué se infiere</h3><p>'+esc(en.inference||"—")+'</p></article><article class="card"><span class="pill">Hipótesis</span><h3>Qué sigue abierto</h3><p>'+esc(en.hypothesis||"—")+'</p></article></div><div class="detail" style="margin-top:14px"><section><div class="card"><h3>Límites</h3><p>'+esc(en.limits||"—")+'</p><h3>Estado epistemológico</h3><p>'+esc(en.epistemology||"—")+'</p></div></section><aside><div class="card"><h3>Bibliografía</h3><ul>'+bib+'</ul>'+citation+'<div class="notice">'+esc(en.note||en.extraction_note||"")+'</div>'+dossier+'</div></aside></div>';
 }
 function relatedHtml(){
   if(!related.length)return "";
   return '<div class="section-kicker" style="margin-top:30px">Objetos relacionados</div><h2 class="section-title">Paralelos por familia</h2><div class="corpus-grid">'+related.map(x=>'<article class="result-card"><div class="media"></div><div class="copy"><div class="meta">'+esc(x)+'</div><h3>'+esc(by[x]?.Nombre_objeto||x)+'</h3><a class="btn alt" href="?id='+encodeURIComponent(x)+'">Abrir ficha →</a></div></article>').join("")+'</div>';
 }
 body.innerHTML='<section class="artifact-stage">'+summaryHtml()+'</section>'+metadataHtml()+'<div id="documentary-slot"><div class="notice" style="margin-top:26px">Cargando lectura documental…</div></div>'+relatedHtml();
 const slot=document.getElementById("documentary-slot");
 const shard=shardFor(r.OBJECT_ID);
 if(!shard){
   slot.innerHTML=enrichmentHtml();
 }else{
   fetch("../data/ficha-enrichment-"+shard+".json")
    .then(rr=>{if(!rr.ok)throw new Error("HTTP "+rr.status);return rr.json()})
    .then(items=>{en=items.find(x=>x.OBJECT_ID===r.OBJECT_ID)||null;slot.innerHTML=enrichmentHtml()})
    .catch(err=>{console.warn("Enriquecimiento no disponible",err);slot.innerHTML='<div class="notice" style="margin-top:26px"><strong>La ficha base está disponible.</strong> La lectura documental no pudo cargarse en este momento.</div>'});
 }
}
</script></body></html>
