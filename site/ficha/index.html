<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS+ · Ficha</title><link rel="stylesheet" href="../assets/iberos-plus.css"></head><body><div id="head"></div>
<section class="hero"><div class="hero-inner"><div class="eyebrow">Ficha web</div><h1 id="title">Cargando objeto…</h1><p id="sub"></p></div></section><main><div id="body"></div></main><footer><div class="wrap">IberOS+ · ficha web derivada del registro público; no sustituye una edición epigráfica original.</div></footer>
<script type="module">import{header,text,csv,esc}from"../assets/portal-data.js";document.getElementById("head").innerHTML=header("../");const rows=csv(await text("../data/objects.csv")),rels=csv(await text("../data/families.csv"));const id=new URLSearchParams(location.search).get("id");const r=rows.find(x=>x.OBJECT_ID===id),body=document.getElementById("body");if(!r){document.getElementById("title").textContent="Objeto no encontrado";body.innerHTML='<div class="empty">El OBJECT_ID solicitado no existe.</div>'}else{document.title="IberOS+ · "+r.Nombre_objeto;document.getElementById("title").textContent=r.Nombre_objeto;document.getElementById("sub").textContent=r.OBJECT_ID+" · "+(r.Referencia_epigráfica||"referencia no fijada");const fam=rels.filter(x=>x.OBJECT_ID===r.OBJECT_ID).map(x=>x.Familia);const fields=[["Tipo",r.Tipo_objeto],["Yacimiento",r.Yacimiento],["Localidad",r.Localidad],["Soporte",r.Soporte],["Escritura",r.Escritura],["Cronología",r.Cronología],["Inclusión IberOS",r.IberOS_Inclusion],["Estado PALEO",r.PALEO_Status],["Módulos activos",r.Modulos_Activos],["Dependencia",r.Dependency_Group],["Estado de ficha",r.Estado_ficha],["PDF declarado",r.Archivo_ficha]];const related=[...new Set(rels.filter(x=>fam.includes(x.Familia)&&x.OBJECT_ID!==r.OBJECT_ID).map(x=>x.OBJECT_ID))].slice(0,8);const by=Object.fromEntries(rows.map(x=>[x.OBJECT_ID,x]));body.innerHTML='<div class="artifact-desk"><div class="desk-grid"><section class="find-card"><div class="section-kicker">Mesa arqueológica</div><h2>'+esc(r.Nombre_objeto)+'</h2><p class="meta">'+esc(r.OBJECT_ID)+' · '+esc(r.Referencia_epigráfica||"referencia no fijada")+'</p><div class="context-grid"><div class="context-cell"><b>Yacimiento</b><span>'+esc(r.Yacimiento||"—")+'</span></div><div class="context-cell"><b>Localidad</b><span>'+esc(r.Localidad||"—")+'</span></div><div class="context-cell"><b>Soporte</b><span>'+esc(r.Soporte||"—")+'</span></div><div class="context-cell"><b>Escritura</b><span>'+esc(r.Escritura||"—")+'</span></div><div class="context-cell"><b>Cronología</b><span>'+esc(r.Cronología||"—")+'</span></div><div class="context-cell"><b>Estado</b><span>'+esc(r.IberOS_Inclusion||"—")+'</span></div></div></section><aside class="toolbelt"><a class="tool-action" href="../laboratorio/?id='+encodeURIComponent(r.OBJECT_ID)+'"><strong>Investigar esta pieza</strong><small>Abrir un proyecto con el objeto ya seleccionado.</small></a><a class="tool-action" href="../webengine/?q='+encodeURIComponent(r.OBJECT_ID)+'"><strong>Buscar en Core</strong><small>Consultar el registro desde este OBJECT_ID.</small></a><a class="tool-action" href="../atlas/"><strong>Situar en el Atlas</strong><small>Explorar el contexto territorial disponible.</small></a><a class="tool-action" href="../modelos3d/"><strong>Explorar 3D</strong><small>Ver recursos reales y modelos simbólicos con su tipo declarado.</small></a></aside></div></div><div class="evidence-path"><div class="evidence-node"><b>Objeto</b><span>contexto y soporte</span></div><div class="evidence-node"><b>Familias</b><span>paralelos estructurales</span></div><div class="evidence-node"><b>Controles</b><span>dependencia y límites</span></div><div class="evidence-node"><b>Hipótesis</b><span>solo después de contrastar</span></div></div><div class="detail"><section><div class="card"><h2>Datos del objeto</h2>'+fields.map(([a,b])=>'<div class="kv"><b>'+esc(a)+'</b><span>'+esc(b||"—")+'</span></div>').join("")+'</div><div class="card" style="margin-top:16px"><h2>Observaciones</h2><p>'+esc(r.Observaciones||"Sin observaciones públicas.")+'</p></div></section><aside><div class="card"><h3>Familias</h3><p>'+fam.map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</p><h3>Fuente declarada</h3><p>'+(r.Fuente?'<a href="'+esc(r.Fuente)+'" target="_blank" rel="noopener">Abrir fuente ↗</a>':'Pendiente en el registro')+'</p><a class="btn gold" href="../laboratorio/?id='+encodeURIComponent(r.OBJECT_ID)+'">Llevar al laboratorio</a><a class="btn" href="../corpus/">Volver al Corpus</a></div></aside></div>'+(related.length?'<div class="section-kicker" style="margin-top:38px">Conexiones</div><h2 class="section-title">Objetos relacionados por familia</h2><div class="grid">'+related.map(x=>'<article class="card"><div class="meta">'+esc(x)+'</div><h3>'+esc(by[x]?.Nombre_objeto||x)+'</h3><a href="?id='+encodeURIComponent(x)+'">Abrir ficha →</a></article>').join("")+'</div>':"")}</script></body></html>
