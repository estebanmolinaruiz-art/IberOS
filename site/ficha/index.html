<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IberOS+ · Ficha</title><link rel="stylesheet" href="../assets/iberos-plus.css"></head><body><div id="head"></div><main><div id="body"></div></main><footer><div class="wrap">Ficha web derivada del registro público. La visualización editorial no se presenta como fotografía del objeto.</div></footer><script type="module">import{header,text,csv,esc}from"../assets/portal-data.js";document.getElementById("head").innerHTML=header("../");const rows=csv(await text("../data/objects.csv")),rels=csv(await text("../data/families.csv"));const enrichmentUrls=[1,2,3,4,5].map(i=>"../data/ficha-enrichment-"+i+".json");const enrichments=(await Promise.all(enrichmentUrls.map(async u=>{const r=await fetch(u);if(!r.ok)throw new Error("No se pudo cargar "+u);return r.json()}))).flat();const id=new URLSearchParams(location.search).get("id"),r=rows.find(x=>x.OBJECT_ID===id),body=document.getElementById("body");if(!r){body.innerHTML='<div class="notice">Objeto no encontrado.</div>'}else{document.title="IberOS+ · "+r.Nombre_objeto;const fam=rels.filter(x=>x.OBJECT_ID===r.OBJECT_ID).map(x=>x.Familia),en=enrichments.find(x=>x.OBJECT_ID===r.OBJECT_ID);const covers={"IBR-PLM-0002":"../assets/ficha-covers/tivissa.webp"};const cover=covers[r.OBJECT_ID]||null;const coverBlock=cover?'<div class="artifact-visual doc-cover"><img src="'+esc(cover)+'" alt="Portada documental de la ficha PDF IberOS"><span class="artifact-doc-label">Portada documental de la ficha PDF IberOS</span></div>':'<div class="artifact-visual"></div>';const fields=[["Tipo",r.Tipo_objeto],["Yacimiento",r.Yacimiento],["Localidad",r.Localidad],["Soporte",r.Soporte],["Escritura",r.Escritura],["Cronología",r.Cronología],["Inclusión IberOS",r.IberOS_Inclusion],["Estado PALEO",r.PALEO_Status],["Módulos activos",r.Modulos_Activos],["Dependencia",r.Dependency_Group],["Estado de ficha",r.Estado_ficha],["PDF declarado",r.Archivo_ficha]];const related=[...new Set(rels.filter(x=>fam.includes(x.Familia)&&x.OBJECT_ID!==r.OBJECT_ID).map(x=>x.OBJECT_ID))].slice(0,6);const by=Object.fromEntries(rows.map(x=>[x.OBJECT_ID,x]));body.innerHTML='<section class="artifact-stage">'+coverBlock+'<div class="artifact-summary"><div class="section-kicker" style="color:var(--gold2)">Ficha de pieza</div><h1>'+esc(r.Nombre_objeto)+'</h1><p class="meta">'+esc(r.OBJECT_ID)+' · '+esc(r.Referencia_epigráfica||"referencia no fijada")+'</p><p>'+esc(r.Yacimiento||"Procedencia no fijada")+(r.Localidad?' · '+esc(r.Localidad):'')+'</p><p><span class="pill">'+esc(r.Soporte||"—")+'</span><span class="pill">'+esc(r.Escritura||"—")+'</span><span class="pill">'+esc(r.Cronología||"—")+'</span></p><div class="artifact-actions"><a href="../webengine/?q='+encodeURIComponent(r.OBJECT_ID)+'">Ver en Core →</a><a href="../laboratorio/?id='+encodeURIComponent(r.OBJECT_ID)+'">Llevar al laboratorio</a><a href="../atlas/">Abrir en Atlas</a><a href="../modelos3d/">Explorar 3D</a></div></div></section><div class="evidence-path"><div class="evidence-node"><b>Descripción</b><span>metadatos y contexto</span></div><div class="evidence-node"><b>Familias</b><span>relaciones estructurales</span></div><div class="evidence-node"><b>Fuente</b><span>procedencia documental</span></div><div class="evidence-node"><b>Proyecto</b><span>pregunta reproducible</span></div></div><div class="detail"><section><div class="card"><h2>Información general</h2>'+fields.map(([a,b])=>'<div class="kv"><b>'+esc(a)+'</b><span>'+esc(b||"—")+'</span></div>').join("")+'</div><div class="card" style="margin-top:12px"><h2>Observaciones</h2><p>'+esc(r.Observaciones||"Sin observaciones públicas adicionales en el registro.")+'</p></div></section><aside><div class="card"><h3>Familias relacionadas</h3><p>'+fam.map(x=>'<span class="pill">'+esc(x)+'</span>').join("")+'</p><h3>Fuente declarada</h3><p>'+(r.Fuente?'<a href="'+esc(r.Fuente)+'" target="_blank" rel="noopener">Abrir fuente original ↗</a>':'Pendiente en este registro')+'</p><a class="btn gold" href="../laboratorio/?id='+encodeURIComponent(r.OBJECT_ID)+'">Investigar esta pieza</a></div></aside></div>'+(en?'<div class="section-kicker" style="margin-top:30px">Lectura documental</div><h2 class="section-title">Evidencia, inferencia y límites</h2><div class="case-grid"><article class="card"><span class="pill ok">Evidencia fuerte</span><h3>Qué sostiene la ficha</h3><p>'+esc(en.evidence||"—")+'</p></article><article class="card"><span class="pill warn">Inferencia apoyada</span><h3>Qué se infiere</h3><p>'+esc(en.inference||"—")+'</p></article><article class="card"><span class="pill">Hipótesis</span><h3>Qué sigue abierto</h3><p>'+esc(en.hypothesis||"—")+'</p></article></div><div class="detail" style="margin-top:14px"><section><div class="card"><h3>Límites</h3><p>'+esc(en.limits||"—")+'</p><h3>Estado epistemológico</h3><p>'+esc(en.epistemology||"—")+'</p></div></section><aside><div class="card"><h3>Bibliografía</h3><ul>'+((en.bibliography||[]).map(b=>'<li>'+esc(b)+'</li>').join(""))+'</ul>'+(en.citation?'<h3>Cita sugerida</h3><p>'+esc(en.citation)+'</p>':'')+'<div class="notice">'+esc(en.note||"")+'</div>'+(en.OBJECT_ID==="IBR-PLM-0002"||en.OBJECT_ID==="IBR-PLM-0003"||en.OBJECT_ID==="IBR-PLM-0004"?'<p><a class="btn gold" href="https://zenodo.org/records/22957236/files/IberOS_CaseStudies_I_v1.0_4_fichas.pdf?download=1">Abrir dossier PDF ↗</a></p>':'')+'</div></aside></div>':'<div class="notice" style="margin-top:26px"><strong>Enriquecimiento documental pendiente en esta ficha pública.</strong> Los metadatos y herramientas siguen disponibles.</div>')+(related.length?'<div class="section-kicker" style="margin-top:30px">Objetos relacionados</div><h2 class="section-title">Paralelos por familia</h2><div class="corpus-grid">'+related.map(x=>'<article class="result-card"><div class="media"></div><div class="copy"><div class="meta">'+esc(x)+'</div><h3>'+esc(by[x]?.Nombre_objeto||x)+'</h3><a
